<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      document.write(Math.PI);
      document.write("<br>");
      document.write(Math.E);
      document.write("<br>");
      document.write(Math.round(4.5));
      document.write("<br>");
      document.write(Math.floor(4.9));
      document.write("<br>");
      document.write(Math.ceil(4.1));
      document.write("<br>");
      document.write(Math.trunc(4.9));
      document.write("<br>");
      document.write(Math.abs(-5));
      document.write("<br>");
      document.write(Math.pow(2, 3));
      document.write("<br>");
      document.write(Math.sqrt(16)); 
      document.write("<br>");
      document.write(Math.max(1, 5, 3));
      document.write("<br>");
      document.write(Math.min(1, 5, 3)); 
      document.write("<br>");
      const rand = (min, max) =>Math.floor(Math.random() * (max - min + 1)) + min;
      document.write(rand(3,6)); 
    </script>
  </body>
</html>
